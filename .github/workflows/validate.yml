name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Skills
            command: yarn test
          - name: Hardening
            command: yarn harden check --package-manager yarn --level moderate
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --global --ignore-scripts corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: ${{ matrix.command }}
